name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoiceguard/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invoiceguard/web/package-lock.json

      # NOTE: `npm install`, NOT `npm ci`: package-lock.json does not yet
      # include vitest (added in this build). The owner must run
      # `npm install` locally after merge and commit the updated lockfile;
      # after that, this step can switch to `npm ci`.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
